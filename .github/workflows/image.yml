name: Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "deploy/**"
      - "apps/**"
      - "packages/**"
      - "scripts/stack-e2e.sh"
      - "scripts/check-version.sh"
      - "pnpm-lock.yaml"
      - ".dockerignore"
      - ".github/workflows/image.yml"

permissions:
  contents: read

jobs:
  image:
    name: build and smoke-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A release tag must name the version the image records, which decides when an upgrade backs
      # up: bump every package's version first (docs/operations.md, Releasing).
      - name: Release tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: scripts/check-version.sh "$GITHUB_REF_NAME"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # The amd64 image, loaded into Docker for the packaged-stack smoke test. Pull requests read
      # the build cache but only main and tags write it, so a pull request cannot seed a publish.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/compose/Dockerfile
          platforms: linux/amd64
          load: true
          tags: movies:ci
          cache-from: type=gha
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max' || '' }}
      - name: Image size
        run: |
          size="$(docker image inspect movies:ci --format '{{.Size}}')"
          echo "movies:ci is $((size / 1024 / 1024)) MiB" | tee -a "$GITHUB_STEP_SUMMARY"

      # The smoke test generates its fixture library with ffmpeg and drives the stack with the
      # repository's SDK, CLI, and Vitest.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pnpm install --frozen-lockfile
      - name: Packaged-stack smoke test
        run: scripts/stack-e2e.sh
        env:
          IMAGE: movies:ci

  # Only main and tags get a token that can push, and only after the smoke test passed.
  publish:
    name: publish to GHCR
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Every v* tag, for scripts/release-channel.sh.
          fetch-depth: 0
      # Only the highest stable version is latest, as on npm and the GitHub Release: a backport
      # such as v0.2.5 after v0.3.0 does not move it.
      - id: channel
        name: Release channel
        run: |
          latest=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]] &&
            [ "$(scripts/release-channel.sh "${GITHUB_REF_NAME#v}")" = latest ]; then
            latest=true
          fi
          echo "latest=$latest" | tee -a "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          # Tag v1.2.3 publishes 1.2.3, 1.2, and latest unless a higher version is tagged; a
          # pre-release (v1.2.3-rc.1) only its own version. main publishes main, the edge. Every
          # build also gets sha-<commit>.
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ steps.channel.outputs.latest == 'true' }}
            type=sha
      # JavaScript builds on the runner's platform; only the runtime stage runs under QEMU.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/compose/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
