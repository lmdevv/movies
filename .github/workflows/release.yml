name: Release

# A release tag publishes the CLI: @movies/cli on npm, and standalone binaries with SHA256SUMS on
# the tag's GitHub Release. The image workflow publishes the image for the same tag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  version:
    name: tag matches the package version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/check-version.sh "$GITHUB_REF_NAME"

  npm:
    name: publish @movies/cli to npm
    needs: version
    runs-on: ubuntu-latest
    # npm trusted publishing: the registry trusts this workflow's OIDC token, so no npm token is
    # stored, and the package gets a provenance attestation.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile --filter @movies/cli...
      # pnpm packs (building the bundle and resolving workspace versions); npm publishes, since its
      # trusted publishing is the documented one.
      - name: Publish unless npm has this version
        run: |
          version="$(scripts/check-version.sh)"
          if [ "$(npm view "@movies/cli@$version" version 2>/dev/null)" = "$version" ]; then
            echo "@movies/cli@$version is already on npm" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          dist_tag=latest
          case "$version" in *-*) dist_tag=next ;; esac
          pnpm --filter @movies/cli pack --pack-destination "$RUNNER_TEMP"
          npm publish "$RUNNER_TEMP/movies-cli-$version.tgz" --provenance --access public --tag "$dist_tag"

  binaries:
    name: binary (${{ matrix.target }})
    needs: version
    strategy:
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    env:
      BINARY: apps/cli/dist/sea/movies-${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @movies/cli...
      - run: pnpm --filter @movies/cli build:sea
      - name: The binary runs and reports the tag's version
        run: |
          [ "v$("$BINARY" --version)" = "$GITHUB_REF_NAME" ]
          "$BINARY" --help | grep -q "Usage: movies"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: movies-${{ matrix.target }}
          path: ${{ env.BINARY }}
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: movies-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum movies-* | tee SHA256SUMS
      - name: Create the release, or replace its assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          prerelease=()
          case "$version" in *-*) prerelease=(--prerelease) ;; esac
          notes="$(cat <<EOF
          ## Install

          - Server: the image \`ghcr.io/lmdevv/movies:$version\` with this tag's \`deploy/compose\`, or the NixOS module from \`github:lmdevv/movies/$GITHUB_REF_NAME\`. Both include the \`movies\` CLI.
          - CLI with Node 22 or newer: \`npm install -g @movies/cli@$version\`.
          - CLI without Node: download \`movies-<os>-<arch>\` below, check it with \`grep movies-linux-x64 SHA256SUMS | sha256sum -c\` (\`shasum -a 256 -c\` on macOS), make it executable, and put it on your PATH as \`movies\`.
          - CLI with Nix: \`nix run github:lmdevv/movies/$GITHUB_REF_NAME -- --help\`, or \`programs.movies\` from \`nixosModules.cli\` or \`homeManagerModules.movies\`.

          Upgrading a server: [docs/operations.md](https://github.com/lmdevv/movies/blob/$GITHUB_REF_NAME/docs/operations.md#upgrading).
          EOF
          )"
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "[movies] $version" \
            --notes "$notes" --generate-notes "${prerelease[@]}"
