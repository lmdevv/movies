name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  # The binaries are copies of this node, so a rerun builds the same ones.
  NODE_VERSION: 24.22.1

jobs:
  version:
    name: tag matches the package version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/check-version.sh "$GITHUB_REF_NAME"

  image:
    name: the tag's image is published
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read
    steps:
      - name: Wait for image.yml on this tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          deadline=$((SECONDS + 110 * 60))
          while true; do
            run="$(gh run list --workflow image.yml --event push --commit "$GITHUB_SHA" \
              --json headBranch,status,conclusion,url \
              --jq '[.[] | select(.headBranch == env.GITHUB_REF_NAME)][0] // empty')"
            if [ -n "$run" ] && [ "$(jq -r .status <<<"$run")" = completed ]; then
              conclusion="$(jq -r .conclusion <<<"$run")"
              url="$(jq -r .url <<<"$run")"
              if [ "$conclusion" = success ]; then
                echo "The image for $GITHUB_REF_NAME is published: $url" | tee -a "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              echo "::error::image.yml for $GITHUB_REF_NAME ended $conclusion ($url). Rerun it, then this workflow."
              exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::image.yml for $GITHUB_REF_NAME did not finish in time${run:+ ($(jq -r .url <<<"$run"))}."
              exit 1
            fi
            sleep 30
          done

  npm:
    name: publish @lmdevv/movies to npm
    # A published version can never be replaced, so it waits until every binary builds and runs
    # and the image is out.
    needs: [binaries, image]
    runs-on: ubuntu-latest
    # npm trusted publishing: the registry trusts this workflow's OIDC token, so no npm token is
    # stored, and the package gets a provenance attestation. No dependency cache and no install
    # scripts in the job that holds it.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile --ignore-scripts --filter @lmdevv/movies...
      # pnpm packs (building the bundle and resolving workspace versions); npm publishes, since its
      # trusted publishing is the documented one. A backport publishes under release-X.Y and a
      # pre-release under next, so neither moves latest.
      - name: Publish unless npm has this version
        run: |
          version="$(scripts/check-version.sh)"
          if [ "$(npm view "@lmdevv/movies@$version" version 2>/dev/null)" = "$version" ]; then
            echo "@lmdevv/movies@$version is already on npm" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          dist_tag="$(scripts/release-channel.sh "$version")"
          pnpm --filter @lmdevv/movies pack --pack-destination "$RUNNER_TEMP"
          npm publish "$RUNNER_TEMP/lmdevv-movies-$version.tgz" --provenance --access public --tag "$dist_tag"
          echo "Published @lmdevv/movies@$version under $dist_tag" | tee -a "$GITHUB_STEP_SUMMARY"

  binaries:
    name: binary (${{ matrix.target }})
    needs: version
    strategy:
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    env:
      BINARY: apps/cli/dist/sea/movies-${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --filter @lmdevv/movies...
      - run: pnpm --filter @lmdevv/movies build:sea
      - name: The binary runs and reports the tag's version
        run: |
          [ "v$("$BINARY" --version)" = "$GITHUB_REF_NAME" ]
          "$BINARY" --help | grep -q "Usage: movies"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: movies-${{ matrix.target }}
          path: ${{ env.BINARY }}
          if-no-files-found: error
      - if: matrix.target == 'linux-x64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: third-party-licenses
          path: apps/cli/dist/sea/THIRD_PARTY_LICENSES.md
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [binaries, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/dist
          merge-multiple: true
      # The binaries' own MIT license ships beside them, with the third-party ones.
      - name: License and checksums
        run: |
          cp LICENSE "$RUNNER_TEMP/dist/LICENSE"
          cd "$RUNNER_TEMP/dist" && sha256sum movies-* | tee SHA256SUMS
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DIST: ${{ runner.temp }}/dist
        run: |
          version="${GITHUB_REF_NAME#v}"
          channel="$(scripts/release-channel.sh "$version")"
          flags=(--latest=false)
          case "$channel" in
            latest) flags=(--latest) ;;
            next) flags=(--latest=false --prerelease) ;;
          esac
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$DIST"/* --clobber
            gh release edit "$GITHUB_REF_NAME" --draft=false "${flags[@]}"
            exit 0
          fi
          download="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          notes="$(cat <<EOF
          ## Install

          - Server: the image \`ghcr.io/lmdevv/movies:$version\` with this tag's \`deploy/compose\`, or the NixOS module from \`github:lmdevv/movies/$GITHUB_REF_NAME\`. Both include the \`movies\` CLI.
          - CLI with Node 22 or newer: \`npm install -g @lmdevv/movies@$version\`.
          - CLI with Nix: \`nix run github:lmdevv/movies/$GITHUB_REF_NAME -- --help\`, or \`programs.movies\` from \`nixosModules.cli\` or \`homeManagerModules.movies\`.
          - CLI without Node: the \`movies-<os>-<arch>\` binary below. Download it with \`curl\`, check it, and put it on your PATH (here Linux x64; use \`movies-linux-arm64\` or \`movies-darwin-arm64\` likewise):

            \`\`\`sh
            curl -fLO $download/movies-linux-x64
            curl -fLO $download/SHA256SUMS
            grep movies-linux-x64 SHA256SUMS | sha256sum -c    # shasum -a 256 -c on macOS
            mkdir -p ~/.local/bin && install -m 755 movies-linux-x64 ~/.local/bin/movies
            \`\`\`

            The macOS binary is signed ad hoc, not notarized. macOS quarantines a binary downloaded in a browser, and Gatekeeper then refuses to run it; \`curl\` does not quarantine, or clear it with \`xattr -d com.apple.quarantine movies-darwin-arm64\`.

          Upgrading a server: [docs/operations.md](https://github.com/lmdevv/movies/blob/$GITHUB_REF_NAME/docs/operations.md#upgrading).
          EOF
          )"
          gh release create "$GITHUB_REF_NAME" "$DIST"/* --verify-tag --title "[movies] $version" \
            --notes "$notes" --generate-notes "${flags[@]}"
