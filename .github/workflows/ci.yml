name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  web-stack:
    name: volume probe ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: scripts/dev-stack.sh up
      - run: pnpm --filter web exec playwright test --project player --reporter=line 2>&1 | tee /tmp/first.log | grep -E "PROBE|^[0-9]+ |---|passed|failed|Error" || true
      - run: pnpm --filter web exec playwright test --project player --no-deps --repeat-each=5 --reporter=line 2>&1 | tee /tmp/repeat.log | grep -E "PROBE|^[0-9]+ |---|passed|failed|Error" || true
      - run: grep -c "PROBE stuck=1" /tmp/first.log /tmp/repeat.log || true
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: probe-${{ matrix.shard }}
          path: |
            apps/web/test-results
            /tmp/first.log
            /tmp/repeat.log
          retention-days: 3
