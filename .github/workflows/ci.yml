name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # The media service tests probe and transcode generated clips with ffmpeg (software paths only).
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm fmt:check
      - run: pnpm test

  stack:
    name: backend against a local Convex
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # The media suite generates fixtures, probes, remuxes, and transcodes (software only).
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: scripts/dev-stack.sh up
      - run: pnpm --filter @movies/backend test:stack
      - run: pnpm --filter @movies/sdk test:stack
      - run: pnpm --filter @movies/cli test:stack
      # The migration suite also imports from a real Jellyfin, set up over the fixture library.
      - run: docker pull jellyfin/jellyfin:12.2
      - run: pnpm --filter @movies/media test:stack
        env:
          MOVIES_JELLYFIN_DOCKER: "1"
      - if: always()
        run: scripts/dev-stack.sh destroy

  web-stack:
    name: web app against a local Convex
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # The suite generates its fixture library with ffmpeg and runs the real media service.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: scripts/dev-stack.sh up
      - run: pnpm --filter web exec playwright test
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: apps/web/test-results
          retention-days: 7
      - if: always()
        run: scripts/dev-stack.sh destroy

  nix:
    name: Nix package and NixOS module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      # Builds the package, shellchecks the startup script, and evaluates the module.
      - run: nix flake check -L
