name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      # The media service tests probe and transcode generated clips with ffmpeg (software paths only).
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm fmt:check
      - run: pnpm test
      - run: pnpm knip
      # The installs pin one Convex backend and expose every media service setting.
      - run: scripts/check-deploy.sh

  stack:
    name: backend against a local Convex
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      # The media suite generates fixtures, probes, remuxes, and transcodes (software only).
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: scripts/dev-stack.sh up
      - run: pnpm --filter @movies/backend test:stack
      - run: pnpm --filter @movies/sdk test:stack
      - run: pnpm --filter @movies/cli test:stack
      # The migration suite also imports from a real Jellyfin, set up over the fixture library.
      - run: docker pull jellyfin/jellyfin:12.2@sha256:357724bf0ae27a672c7cbaa899db2d9abeb13dbd8657ccce750258a4c059d037
      - run: pnpm --filter @movies/media test:stack
        env:
          MOVIES_JELLYFIN_DOCKER: "1"
      - if: always()
        run: scripts/dev-stack.sh destroy

  web-stack:
    name: web app against a local Convex
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      # The suite generates its fixture library with ffmpeg and runs the real media service.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: scripts/dev-stack.sh up
      # The migration suite imports from a real Jellyfin, set up over the fixture library.
      - run: docker pull jellyfin/jellyfin:12.2@sha256:357724bf0ae27a672c7cbaa899db2d9abeb13dbd8657ccce750258a4c059d037
      - run: pnpm --filter web exec playwright test
        env:
          MOVIES_JELLYFIN_DOCKER: "1"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: apps/web/test-results
          retention-days: 7
      - if: always()
        run: scripts/dev-stack.sh destroy

  nix:
    name: Nix package and NixOS module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      # Builds the package, shellchecks the startup script, evaluates the module, and boots it in a
      # NixOS VM (checks.x86_64-linux.vm, under KVM, which install-nix-action enables).
      - run: nix flake check -L
