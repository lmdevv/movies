name: Demo library

# Builds the demo library image when what goes into it changes. On main it publishes the version
# named in deploy/demo-library/image, once; a published version is never overwritten.
on:
  pull_request:
    paths: &paths
      - "deploy/demo-library/**"
      - "scripts/demo-library.sh"
      - "scripts/build-demo-library.sh"
      - ".github/workflows/demo-library.yml"
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch:

concurrency:
  group: demo-library-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # The full set is about 7.5 GB from archive.org and download.blender.org, and the Feature Test
    # encodes an HDR10 HEVC version; both are slow on a shared runner.
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The download (about 7.5 GB with its cache), BuildKit's copy of it for each platform, and the
      # pushed layers need about 30 GB; the runner starts with less free. Its Android, .NET, Haskell,
      # and CodeQL toolchains and its cached Docker images are unused here.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL
          docker image prune --all --force >/dev/null
          df -h /
      # ffmpeg, dvdauthor, and fontconfig come from the flake's nixpkgs through its dev shell, not
      # apt: the runner's apt mirror has hung installs for half an hour at a time, and the Feature
      # Test's image subtitle needs dvdauthor with the shell's fonts.
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: >-
          nix develop --command
          scripts/build-demo-library.sh ${{ github.event_name != 'pull_request' && '--push' || '' }}
      - if: always()
        run: df -h /
